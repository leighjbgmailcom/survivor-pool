name: Fetch official scores

# Global TV posts each episode's Fantasy Tribe points on Thursday evenings after 6 PM Eastern.
on:
  schedule:
    # GitHub often runs scheduled jobs late or skips them, so check often around posting time.
    - cron: "7,37 22,23 * * 4"  # Thu 6–8 PM Eastern, every half hour
    - cron: "7,37 0-5 * * 5"    # Thu 8 PM – 2 AM Eastern, every half hour
    - cron: "17 10,13,17,21 * * *"  # daily catch-ups
  workflow_dispatch: {}         # "Run workflow" button on the Actions tab
  push:
    paths: [".github/workflows/fetch-results.yml", "tools/fetch_results.py", "seasons/seasons.csv", "seasons/refresh.txt"]   # also runs right after a new season is started, or when an organizer clicks "Check for new scores now"

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results from Global TV
        run: python tools/fetch_results.py
      - name: Save any new scores
        run: |
          if git status --porcelain -- seasons | grep -q .; then
            git config user.name "survivor-pool scores bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seasons
            git commit -m "Update official scores from Global TV"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          else
            echo "No new scores."
          fi
