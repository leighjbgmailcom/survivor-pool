name: Fetch official scores

# Global TV posts each episode's Fantasy Tribe points on Thursday evenings after 6 PM Eastern.
on:
  schedule:
    - cron: "7 22,23 * * 4"     # Thu 6–7 PM Eastern
    - cron: "7 0-4 * * 5"       # Thu 8 PM – midnight Eastern
    - cron: "17 13 * * *"       # daily catch-up, ~9 AM Eastern
  workflow_dispatch: {}         # "Run workflow" button on the Actions tab
  push:
    paths: [".github/workflows/fetch-results.yml", "tools/fetch_results.py", "seasons/seasons.csv"]   # also runs right after a new season is started

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results from Global TV
        run: python tools/fetch_results.py
      - name: Save any new scores
        run: |
          if git status --porcelain -- seasons | grep -q .; then
            git config user.name "survivor-pool scores bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seasons
            git commit -m "Update official scores from Global TV"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          else
            echo "No new scores."
          fi
