name: Fetch official scores

# Global TV posts each episode's Fantasy Tribe points late Wednesday night or on Thursday.
# Checks (Eastern): Wed 10 PM, then Thu 8 AM, 12 PM, 3 PM and 6 PM.
# GitHub schedules are in UTC only, so each time is listed for both EST (UTC-5) and EDT (UTC-4);
# that means one extra check an hour early or late, which is harmless (no new scores = no change).
on:
  schedule:
    - cron: "7 2,3 * * 4"            # Wed 10 PM Eastern
    - cron: "7 12,13 * * 4"          # Thu 8 AM Eastern
    - cron: "7 16,17 * * 4"          # Thu 12 PM Eastern
    - cron: "7 19,20 * * 4"          # Thu 3 PM Eastern
    - cron: "7 22,23 * * 4"          # Thu 6 PM Eastern
  workflow_dispatch: {}         # "Run workflow" button on the Actions tab
  push:
    paths: [".github/workflows/fetch-results.yml", "tools/fetch_results.py", "tools/breakdown.py", "seasons/seasons.csv", "seasons/refresh.txt"]   # also runs right after a new season is started, or when an organizer clicks "Check for new scores now"

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results from Global TV
        run: python tools/fetch_results.py
      - name: Read the points breakdown from a new results picture
        if: hashFiles('.need_ocr') != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install -q pillow pytesseract
          rm -f .need_ocr
          python tools/fetch_results.py
      - name: Save any new scores
        run: |
          if git status --porcelain -- seasons | grep -q .; then
            git config user.name "survivor-pool scores bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seasons
            git commit -m "Update official scores from Global TV"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          else
            echo "No new scores."
          fi
